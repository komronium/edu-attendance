# Manual only: Actions does not run for this private repo without billing, so the same checks run
# locally before every push (.githooks/pre-push, `make hooks`). To use this again, add `push:` and
# `pull_request:` under `on:`, or run it from the Actions tab.
name: test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: vet, race tests, JS tests, vulnerabilities, browser smoke test
        run: make check
        env:
          E2E_CHROME: google-chrome

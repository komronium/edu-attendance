<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>attendance</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<script src="/theme.js"></script>
<link rel="preload" href="/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#view">Asosiy qismga o'tish</a>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#/" aria-label="attendance, bosh sahifa">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span>attendance</span>
    </a>
    <button type="button" id="open-palette" class="side-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/><path d="m21 21-4.300-4.300"/></svg><span>Qidirish</span><kbd>Ctrl K</kbd></button>
    <nav class="tabs" aria-label="Bo'limlar">
      <a href="#/" data-nav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.500 12 3l9 7.500V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Bugun</span>
      </a>
      <a href="#/jadval" data-nav="schedule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M9 4v17M15 4v17"/></svg>
        <span>Jadval</span>
      </a>
      <p class="nav-label">Hisobot</p>
      <a href="#/yuklama" data-nav="load">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>
        <span>Yuklama</span>
      </a>
      <a href="#/ustama" data-nav="months">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        <span>Ustama</span>
      </a>
      <a href="#/ilmiy-kpi" data-nav="kpi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        <span>Ilmiy KPI</span>
      </a>
      <p class="nav-label">Kurs</p>
      <a href="#/guruh" data-nav="group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span><span id="course-name"></span></span>
        <b id="owed-badge" class="count" hidden></b>
      </a>
      <p class="nav-label">Tizim</p>
      <a href="#/sozlamalar" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>
        <span>Sozlamalar</span>
        <b id="note-badge" class="count" hidden></b>
      </a>
    </nav>
    <div class="side-foot">
    <a id="sync-alert" class="sync-alert" href="#/sozlamalar" hidden></a>
    <p id="sync-time" class="sync-time" hidden></p>
    <a class="logout" href="/logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      <span>Chiqish</span>
    </a>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<p id="msg" class="toast" role="alert" hidden></p>
<dialog id="confirm" aria-labelledby="confirm-text">
  <form method="dialog">
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button value="cancel" autofocus>Bekor qilish</button>
      <button value="ok" class="primary">Ha</button>
    </div>
  </form>
</dialog>
<dialog id="palette" aria-label="Qidirish">
  <input id="palette-input" type="search" placeholder="Sahifa yoki talaba" autocomplete="off" aria-label="Sahifa yoki talaba qidirish">
  <ul id="palette-list" class="plain"></ul>
  <p class="palette-hint">↑ ↓ tanlash · Enter ochish · Esc yopish</p>
</dialog>
<dialog id="relogin" aria-labelledby="relogin-title">
  <form class="stack">
    <h2 id="relogin-title">Sessiya tugadi</h2>
    <p class="sub">Parolni kiriting: sahifa va yozganlaringiz joyida qoladi.</p>
    <input name="password" type="password" autocomplete="current-password" required aria-label="Parol">
    <p class="login-error" role="alert"></p>
    <div class="dialog-actions"><a class="button quiet push-left" href="/login">Kirish sahifasi</a><button type="submit" class="primary">Kirish</button></div>
  </form>
</dialog>
<dialog id="sheet" aria-labelledby="sheet-title">
  <h2 id="sheet-title"></h2>
  <div id="sheet-body"></div>
  <p id="sheet-error" class="form-error" role="alert" hidden></p>
</dialog>
<script src="/pace.js"></script>
<script src="/lib/dates.js"></script>
<script src="/lib/rules.js"></script>
<script src="/lib/timetable.js"></script>
<script src="/lib/load.js"></script>
<script src="/lib/ustama.js"></script>
<script src="/lib/plans.js"></script>
<script src="/lib/format.js"></script>
<script src="/app.js"></script>
</body>
</html>
